name: Daily Supabase database health check

on:
  schedule:
    # 06:00 Asia/Taipei (22:00 UTC on the previous day), daily.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: database-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Public application URL only; no Supabase credentials are required.
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'https://nutc.cc.cd/api/health' }}
    steps:
      - name: Verify database health
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          url = os.environ['HEALTHCHECK_URL']
          parsed = urllib.parse.urlsplit(url)
          if (parsed.scheme != 'https' or not parsed.hostname or parsed.username
              or parsed.password or parsed.query or parsed.fragment):
              sys.exit('HEALTHCHECK_URL must be a public HTTPS URL without credentials or query parameters.')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(url, headers={
                      'Accept': 'application/json',
                      'User-Agent': 'Lottery-Database-Healthcheck/1.0',
                  })
                  with opener.open(request, timeout=20) as response:
                      data = json.loads(response.read(4096))
                      if response.status != 200 or not isinstance(data, dict) or data.get('status') != 'ok':
                          raise ValueError('Unexpected health response')
                  print('Database health check passed.')
                  break
              except (urllib.error.URLError, TimeoutError, OSError, ValueError) as error:
                  # Do not print response bodies, URL credentials or database details.
                  detail = f'HTTP {error.code}' if isinstance(error, urllib.error.HTTPError) else type(error).__name__
                  print(f'Attempt {attempt}/3 failed: {detail}', flush=True)
                  if attempt == 3:
                      sys.exit('Database health check failed. Check the deployment and Supabase project status.')
                  time.sleep(10)
          PY
